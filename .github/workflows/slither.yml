name: Static Analysis

on:
  pull_request:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  slither:
    name: Slither analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Run Slither
        uses: crytic/slither-action@v0.4.1
        with:
          fail-on: high
          slither-args: --filter-paths "lib/|test/|script/|src/mocks/" --exclude naming-convention
